name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Security CLI check
        run: |
          mcp-assure status
          mcp-assure check
          mcp-assure evaluate --tool echo --args-json '{"text":"ci"}' --pack baseline
      - name: Demo
        run: python -m mcp_assure demo
