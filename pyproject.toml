[project]
name = "mcp-assure"
version = "0.3.0"
description = "Open-source security CLI and runtime for MCP-style agent tool calls: deny-by-default policy, adaptive campaign watch, hash-chained receipts."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Alex Price", email = "hello@xclusivexo.com" }]
keywords = ["mcp", "security", "agents", "authorization", "audit", "assurance", "fastmcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "build>=1.2", "twine>=5.0"]
yaml = ["pyyaml>=6.0"]
# FastMCP middleware (on_call_tool). Core package stays zero-dep without this extra.
fastmcp = ["fastmcp>=2.9"]

[project.scripts]
mcp-assure = "mcp_assure.__main__:main"

[project.urls]
Homepage = "https://github.com/StellarRequiem/mcp-assure"
Repository = "https://github.com/StellarRequiem/mcp-assure"
Documentation = "https://github.com/StellarRequiem/mcp-assure#readme"
Issues = "https://github.com/StellarRequiem/mcp-assure/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_assure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
